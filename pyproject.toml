[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-client-platform"
version = "0.1.0"
description = "Hermes Plugin: OpenAI-kompatible Platform mit client_*-Tool-Passthrough (blockierende Handler)"
requires-python = ">=3.11"
# aiohttp ist in der Laufzeitumgebung (Hermes-Venv) vorhanden; die Deklaration
# dient der eigenstaendigen Entwicklung in VS Code.
dependencies = [
    "aiohttp>=3.10",
]

[tool.setuptools.packages.find]
where = ["src"]
